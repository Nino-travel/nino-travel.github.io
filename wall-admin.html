<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Wall admin</title>
<style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom));background:#f6f6f8;color:#111}h1{font-size:1.2rem;margin:4px 0 12px}h2{font-size:.95rem;margin:0 0 8px}.row{display:flex;gap:8px}input,textarea{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid #ccc;border-radius:12px;background:#fff;color:#111}textarea{width:100%;resize:vertical;min-height:72px;display:block}button{font:inherit;font-size:.9rem;font-weight:600;padding:9px 14px;border:0;border-radius:12px;background:#0a84ff;color:#fff;cursor:pointer;transition:transform .12s,opacity .15s}button:active{transform:scale(.96)}button:disabled{opacity:.4}button.del{background:#ff3b30;padding:6px 10px;font-size:.8rem}button.rep{background:#e9e9eb;color:#0a84ff;padding:6px 10px;font-size:.8rem}.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:12px 0}.who{display:flex;align-items:center;gap:4px;color:#0a84ff;font-weight:600;font-size:.82rem;margin-bottom:8px}.ck{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:#0a84ff;color:#fff;font-size:9px;font-weight:800}.bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}#cnt{color:#888;font-size:.78rem}#rs{font-size:.82rem;min-height:1.1em;margin-top:6px}.ok{color:#1a7f37}.no{color:#d70015}.m{display:flex;gap:8px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}.m.nino{background:#eaf3ff}.m>div{flex:1;min-width:0}.acts{display:flex;flex-direction:column;gap:6px}.u{font-size:.75rem;color:#888}.m.nino .u{color:#0a84ff;font-weight:600}.t{overflow-wrap:anywhere}.rc{display:inline-block;margin-top:5px;font-size:.78rem;background:#f0f0f2;border-radius:10px;padding:2px 8px;color:#3a3a3c}#st{color:#888;font-size:.85rem;margin:8px 0}details{margin-bottom:4px}summary{color:#666;font-size:.85rem;cursor:pointer;padding:4px 0}</style></head>
<body><h1>Nino 💬 wall admin</h1>
<details id="kd"><summary>Admin key</summary><div class="row" style="margin-top:6px"><input id="k" type="password" placeholder="Paste admin key" autocomplete="off"><button id="save">Save</button></div></details>
<div class="card"><div class="who">Reply as @yssn_nino1 <span class="ck">✓</span></div>
<form id="rf"><textarea id="rt" maxlength="300" placeholder="Write back to your fans…"></textarea>
<div class="bar"><span id="cnt">0/300</span><button id="rsend" type="submit" disabled>Send</button></div><div id="rs"></div></form></div>
<p id="st"></p><div id="list"></div>
<script>(function(){var API="https://nino-wall.yssn-nino.workers.dev",k=document.getElementById("k"),st=document.getElementById("st"),list=document.getElementById("list"),rf=document.getElementById("rf"),rt=document.getElementById("rt"),rsend=document.getElementById("rsend"),rs=document.getElementById("rs"),cnt=document.getElementById("cnt"),busy=false;
function key(){return localStorage.getItem("nw_admin")||""}
k.value=key();if(!key())document.getElementById("kd").open=true;
document.getElementById("save").onclick=function(){localStorage.setItem("nw_admin",k.value.trim());st.textContent="Key saved on this device.";document.getElementById("kd").open=false;load()};
function upd(){cnt.textContent=rt.value.length+"/300";rsend.disabled=busy||!rt.value.trim()}
rt.addEventListener("input",upd);
function say(msg,ok){rs.className=ok?"ok":"no";rs.textContent=msg}
rf.addEventListener("submit",function(e){e.preventDefault();var text=rt.value.replace(/\s+/g," ").trim();if(!text)return;if(!key()){say("Paste and save your admin key first.",false);document.getElementById("kd").open=true;return}busy=true;upd();say("Sending…",true);
fetch(API+"/messages",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":key()},body:JSON.stringify({text:text})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d}})}).then(function(x){if(!x.ok){say(x.d.error||"Couldn't send.",false);return}if(!x.d.message||x.d.message.is_nino!=1){say("Sent, but not as Nino — check your admin key.",false);load();return}rt.value="";say("Sent ✓ It's live on the wall as @yssn_nino1.",true);load()}).catch(function(){say("Couldn't send. Check your connection.",false)}).then(function(){busy=false;upd()})});
function load(){fetch(API+"/messages?limit=100",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){var ms=(d.messages||[]).slice().reverse();list.textContent="";if(!ms.length){st.textContent="No messages.";return}st.textContent=ms.length+" messages (newest first)";ms.forEach(function(m){var nino=m.is_nino==1;var row=document.createElement("div");row.className="m"+(nino?" nino":"");var b=document.createElement("div");var u=document.createElement("div");u.className="u";u.textContent=(nino?"@yssn_nino1 ✓ (you)":"@"+m.username)+" · #"+m.id+" · "+new Date(m.created_at*1000).toLocaleString();var t=document.createElement("div");t.className="t";t.textContent=m.text;b.appendChild(u);b.appendChild(t);var rk=m.reactions?Object.keys(m.reactions):[];if(rk.length){var rc=document.createElement("div");rc.className="rc";rc.textContent=rk.map(function(e){return e+" "+m.reactions[e]}).join("  ");b.appendChild(rc)}var acts=document.createElement("div");acts.className="acts";if(!nino){var rp=document.createElement("button");rp.className="rep";rp.type="button";rp.textContent="Reply";rp.onclick=function(){rt.value="@"+m.username+" ";upd();window.scrollTo({top:0,behavior:"smooth"});rt.focus();rt.setSelectionRange(rt.value.length,rt.value.length)};acts.appendChild(rp)}var x=document.createElement("button");x.className="del";x.type="button";x.textContent="Delete";x.onclick=function(){if(!confirm("Delete this message?"))return;fetch(API+"/messages/"+m.id,{method:"DELETE",headers:{"X-Admin-Key":key()}}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j.error||"Error";row.remove()})}).catch(function(e){alert("Delete failed: "+e)})};acts.appendChild(x);row.appendChild(b);row.appendChild(acts);list.appendChild(row)})}).catch(function(){st.textContent="Couldn't load messages."})}
load();setInterval(function(){if(!document.hidden)load()},15000)})();</script>
</body></html>
