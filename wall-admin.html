<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wall admin</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:18px;background:#f6f6f8;color:#111}h1{font-size:1.2rem}.row{display:flex;gap:8px}input{flex:1;font-size:16px;padding:8px 10px;border:1px solid #ccc;border-radius:10px}button{font-size:.9rem;padding:8px 12px;border:0;border-radius:10px;background:#0a84ff;color:#fff;cursor:pointer}button.del{background:#ff3b30;padding:6px 10px}.m{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}.m div{flex:1;min-width:0}.u{font-size:.75rem;color:#888}.t{overflow-wrap:anywhere}#st{color:#888;font-size:.85rem;margin:8px 0}</style></head>
<body><h1>Nino 💬 wall admin</h1>
<div class="row"><input id="k" type="password" placeholder="Paste admin key" autocomplete="off"><button id="save">Save</button></div>
<p id="st"></p><div id="list"></div>
<script>(function(){var API="https://nino-wall.yssn-nino.workers.dev",k=document.getElementById("k"),st=document.getElementById("st"),list=document.getElementById("list");k.value=localStorage.getItem("nw_admin")||"";document.getElementById("save").onclick=function(){localStorage.setItem("nw_admin",k.value.trim());st.textContent="Key saved on this device.";load()};
function load(){fetch(API+"/messages?limit=100",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){var ms=(d.messages||[]).slice().reverse();list.textContent="";if(!ms.length){st.textContent="No messages.";return}ms.forEach(function(m){var row=document.createElement("div");row.className="m";var b=document.createElement("div");var u=document.createElement("div");u.className="u";u.textContent="@"+m.username+" · #"+m.id+" · "+new Date(m.created_at*1000).toLocaleString();var t=document.createElement("div");t.className="t";t.textContent=m.text;b.appendChild(u);b.appendChild(t);var x=document.createElement("button");x.className="del";x.textContent="Delete";x.onclick=function(){if(!confirm("Delete this message?"))return;fetch(API+"/messages/"+m.id,{method:"DELETE",headers:{"X-Admin-Key":localStorage.getItem("nw_admin")||""}}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j.error||"Error";row.remove()})}).catch(function(e){alert("Delete failed: "+e)})};row.appendChild(b);row.appendChild(x);list.appendChild(row)})}).catch(function(){st.textContent="Couldn't load messages."})}
load();setInterval(load,15000)})();</script>
</body></html>
